name: Promote Release (standing native-testing waiver)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact staged release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-and-promote:
    name: Validate exact staged assets and promote with native checks untested
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        run: |
          set -euo pipefail
          if ! printf '%s' "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must match vMAJOR.MINOR.PATCH."
            exit 2
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Require exact tagged source and draft disclosure
        id: release
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse HEAD)
          test "${#TAG_COMMIT}" -eq 40
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')" = true
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')" = "$RELEASE_TAG"
          printf '%s' "$RELEASE_JSON" | jq -er '.body | select(test("untested"; "i"))' >/dev/null || {
            echo "::error::Draft release notes must disclose untested native checks."
            exit 1
          }
          printf 'tag_commit=%s\n' "$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Download complete draft asset set
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*'

      - name: Verify asset allowlist, successful staging attempt, and Windows candidate
        env:
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          MSI="assets/go-schedule_${RELEASE_TAG}_windows_amd64.msi"
          MANIFEST="assets/windows-candidate-manifest.json"
          test -f "$MSI"
          test -f "$MANIFEST"
          cat > "$RUNNER_TEMP/expected-assets.txt" <<EOF
          go-schedule_${RELEASE_TAG}_darwin_amd64.tar.gz
          go-schedule_${RELEASE_TAG}_darwin_arm64.tar.gz
          go-schedule_${RELEASE_TAG}_linux_amd64.tar.gz
          go-schedule_${RELEASE_TAG}_linux_arm64.tar.gz
          go-schedule-desktop_${RELEASE_TAG}_darwin_arm64.tar.gz
          go-schedule-desktop_${RELEASE_TAG}_linux_amd64.tar.gz
          go-schedule_${RELEASE_TAG}_windows_amd64.msi
          windows-candidate-manifest.json
          EOF
          find assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/observed-assets.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/expected-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/observed-assets.txt" || {
            echo "::error::Draft asset set is incomplete or contains an unexpected file."
            exit 1
          }
          RUN_ID=$(jq -er '.run_id | select(type == "number" and . > 0)' "$MANIFEST")
          RUN_ATTEMPT=$(jq -er '.run_attempt | select(type == "number" and . > 0)' "$MANIFEST")
          RUN_WORKFLOW=$(jq -er '.workflow | select(type == "string" and length > 0)' "$MANIFEST")
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          test "$(printf '%s' "$RUN_JSON" | jq -r '.status')" = completed
          test "$(printf '%s' "$RUN_JSON" | jq -r '.conclusion')" = success
          test "$(printf '%s' "$RUN_JSON" | jq -r '.event')" = push
          test "$(printf '%s' "$RUN_JSON" | jq -r '.head_sha')" = "$TAG_COMMIT"
          test "$(printf '%s' "$RUN_JSON" | jq -r '.path')" = '.github/workflows/release.yml'
          test "$(printf '%s' "$RUN_JSON" | jq -r '.name')" = "$RUN_WORKFLOW"
          test "$RUN_WORKFLOW" = Release
          ATTEMPT_JOBS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100")
          WINDOWS_JOB_COUNT=$(printf '%s' "$ATTEMPT_JOBS" | jq '[.jobs[] | select(.name == "Build & stage GUI (windows-latest)" and .status == "completed" and .conclusion == "success")] | length')
          test "$WINDOWS_JOB_COUNT" -eq 1 || {
            echo "::error::Candidate manifest attempt lacks one successful Windows staging job."
            exit 1
          }
          go run ./scripts/windows-release-gate verify-candidate \
            --candidate-manifest "$MANIFEST" \
            --artifact "$MSI" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$TAG_COMMIT"

      - name: Generate and verify all-asset checksums
        run: |
          set -euo pipefail
          test ! -e assets/SHA256SUMS.txt || {
            echo "::error::Unexpected checksum asset already exists on draft."
            exit 1
          }
          (
            cd assets
            LC_ALL=C sha256sum * > "$RUNNER_TEMP/SHA256SUMS.txt"
            sha256sum -c "$RUNNER_TEMP/SHA256SUMS.txt"
          )
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"

      - name: Re-download and verify final draft assets
        run: |
          set -euo pipefail
          mkdir final-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir final-assets --pattern '*'
          (
            cd final-assets
            sha256sum -c SHA256SUMS.txt
            test "$(wc -l < SHA256SUMS.txt)" -eq 8
            test "$(find . -maxdepth 1 -type f | wc -l)" -eq 9
          )

      - name: Recheck immutable tag and publish disclosed waiver release
        env:
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          REMOTE_TAG=$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$REMOTE_TAG" ]; then
            REMOTE_TAG=$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')
          fi
          test "$REMOTE_TAG" = "$TAG_COMMIT" || {
            echo "::error::Release tag moved after candidate validation."
            exit 1
          }
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')" = true
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')" = "$RELEASE_TAG"
          printf '%s' "$RELEASE_JSON" | jq -er '.body | select(test("untested"; "i"))' >/dev/null
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -er '.id')
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=true >/dev/null
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          test "$LATEST_TAG" = "$RELEASE_TAG"
