name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    # CGO off so the cgo-only GUI entry point resolves to its stub (the OpenGL
    # driver is not installed on this job); the rest of the tree is cgo-free.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: sh scripts/verify.sh format
      - name: go vet
        run: sh scripts/verify.sh vet
      - name: golangci-lint
        run: sh scripts/verify.sh lint
      - name: Verify automation contract
        run: sh scripts/verify.sh automation

  test:
    name: Test (race), ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The race detector requires cgo; the CI runners provide a C toolchain.
      # The production desktop is a separate Go module with native WebView
      # dependencies and is verified by the wails-desktop job below.
      - name: go test -race
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: sh scripts/verify.sh race

  v13-release-qualification:
    name: v1.3 release qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise package-shaped notification and MCP boundaries
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race ./test/integration -run '^(TestV13PackageDefaultsRemainOptIn|TestWebhookNotificationEndToEndPreservesRunOutcome|TestPackagedMCPCommandDiscovery)$' -count=1
      - name: Qualify detailed notification and MCP behavior
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/notification ./internal/mcpobserve ./internal/mcphttp ./internal/api/server ./internal/api/client ./internal/cli
      - name: Qualify notification storage and migration preservation
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/store

  windows-service-core:
    name: Windows LocalSystem execution
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build service probe binaries
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 's038-service-core\bin'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          go build -o (Join-Path $stage 'goschedd.exe') ./cmd/goschedd
          go build -o (Join-Path $stage 'gosched.exe') ./cmd/gosched
      - name: Prove LocalSystem task execution
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 's038-service-core'
          & ./test/windows/Invoke-ServiceCoreCI.ps1 `
            -StageDirectory (Join-Path $root 'bin') `
            -EvidencePath (Join-Path $root 'evidence.json')
      - name: Upload service-boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-service-core-evidence
          path: ${{ runner.temp }}/s038-service-core
          if-no-files-found: warn

  windows-msi-contract:
    name: Windows MSI compiled & silent contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: desktop/frontend
        run: npm ci
      - name: Stage Windows installer binaries
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 's039-msi-contract'
          $stage = Join-Path $root 'stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Push-Location desktop
          try {
            go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean
          } finally {
            Pop-Location
          }
          Copy-Item desktop/build/bin/gosched-gui.exe (Join-Path $stage 'gosched-gui.exe')
          go build -o (Join-Path $stage 'goschedd.exe') ./cmd/goschedd
          go build -o (Join-Path $stage 'gosched.exe') ./cmd/gosched
          go build -ldflags '-H windowsgui' `
            -o (Join-Path $stage 'gosched-cleanup.exe') ./cmd/gosched-cleanup
          Copy-Item README.md, LICENSE, CHANGELOG.md -Destination $stage
          Copy-Item brand/fonts/licenses/OFL-Geist.txt, brand/fonts/licenses/OFL-Space-Grotesk.txt -Destination $stage
      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 's039-wix'
          dotnet tool install --tool-path $tools wix --version 6.0.2
          $wix = Join-Path $tools 'wix.exe'
          & $wix --version
          & $wix extension add -g WixToolset.UI.wixext/6.0.2
          & $wix extension add -g WixToolset.Util.wixext/6.0.2
      - name: Build and inspect compiled MSI contracts
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 's039-msi-contract'
          $stage = Join-Path $root 'stage'
          $tools = Join-Path $env:RUNNER_TEMP 's039-wix'
          $wix = Join-Path $tools 'wix.exe'
          $baseline = Join-Path $root 'go-schedule_s039-baseline.msi'
          $candidate = Join-Path $root 'go-schedule_s039-candidate.msi'
          & ./build/windows/verify_wxs.ps1 -StageDir $stage
          & $wix build build/windows/goschedule.wxs -arch x64 `
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -d Version=1.0.0 -d "StageDir=$stage" -o $baseline
          & $wix build build/windows/goschedule.wxs -arch x64 `
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -d Version=1.0.1 -d "StageDir=$stage" -o $candidate
          & ./test/windows/inspect-installer.ps1 `
            -MsiPath $candidate `
            -EvidencePath (Join-Path $root 'compiled-msi.md') `
            -ArtifactClass candidate `
            -ArtifactOrigin "CI build from commit $env:GITHUB_SHA"
      - name: Exercise silent installer lifecycle contract
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 's039-msi-contract'
          & ./test/windows/Invoke-InstallerContractCI.ps1 `
            -BaselineMsiPath (Join-Path $root 'go-schedule_s039-baseline.msi') `
            -MsiPath (Join-Path $root 'go-schedule_s039-candidate.msi') `
            -EvidencePath (Join-Path $root 'silent-lifecycle.json') `
            -ArtifactOrigin "CI build from commit $env:GITHUB_SHA" `
            -Confirm:$false
      - name: Upload compiled and silent MSI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi-contract-evidence
          path: ${{ runner.temp }}/s039-msi-contract
          if-no-files-found: warn

  coverage:
    name: Coverage gate (core packages ≥80%)
    runs-on: ubuntu-latest
    # Core packages are cgo-free; CGO off avoids needing the GUI's OpenGL libs.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Runs the same script contributors run locally (see CLAUDE.md). One
      # implementation, so the local check and the CI check cannot drift into
      # measuring different things.
      - name: Measure core-package statement coverage
        run: sh scripts/verify.sh coverage

  build:
    name: Cross-compile (daemon + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all targets (cgo-free)
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            echo "building $os/$arch"
            GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/goschedd ./cmd/gosched
          done

  wails-desktop:
    name: Production desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Linux WebKitGTK prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install exact frontend dependencies
        working-directory: desktop/frontend
        run: npm ci
      - name: Audit and verify frontend
        working-directory: desktop/frontend
        run: npm audit --audit-level=high && npm test && npm run build
      - name: Test connection boundary under race detector
        run: go test -race ./...
      - name: Exercise the guided platform task end to end
        working-directory: .
        run: go test ./test/integration -run TestGuidedPlatformExampleCreatesRunsAndRecordsRecognizableActivity -count=1
      - name: Build Linux desktop
        if: runner.os == 'Linux'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -tags webkit2_41
      - name: Build native desktop
        if: runner.os != 'Linux'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean
      - name: Inspect stable desktop identity
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f build/bin/gosched-gui.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Wails uses the application display name for the generated bundle
            # directory and outputfilename for its executable. Release staging
            # renames this bundle to the stable gosched-gui.app contract.
            test -d build/bin/go-schedule.app
            test -f build/bin/go-schedule.app/Contents/MacOS/gosched-gui
          else
            test -f build/bin/gosched-gui
          fi

  wails-desktop-browser-contract:
    name: Production desktop accessibility and responsive contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci
      - name: Install Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Exercise production accessibility, responsive, and offline contracts
        run: npm run test:e2e

  bench:
    name: Engine benchmarks (artifact only)
    runs-on: ubuntu-latest
    # Informational signal, not a gate: this job runs the engine benchmarks and
    # publishes their output for review. The enforced dispatch-latency gate is
    # the p99 assertion TestDispatchLatencyP99 (run in the `test` job above), not
    # a benchmark-delta comparison here. The engine package is cgo-free.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # -run '^$' matches no tests, so only benchmarks execute (the functional
      # suite is not re-run here). -benchmem surfaces per-op allocations.
      - name: Run engine benchmarks
        run: go test -run '^$' -bench . -benchmem ./internal/engine/... | tee bench.txt
      - name: Upload benchmark output
        uses: actions/upload-artifact@v7
        with:
          name: engine-benchmarks
          path: bench.txt

  docs:
    name: Docs link check
    runs-on: ubuntu-latest
    # No Go toolchain: docs-check.sh is pure POSIX sh with no network. It guards
    # the docs/ site sources, front matter, on-disk link integrity, no links
    # escaping docs/, and pointer-README validity. Runs the same script
    # contributors run locally, so the local and CI checks cannot drift.
    steps:
      - uses: actions/checkout@v7
      - name: Check documentation integrity
        run: sh scripts/verify.sh docs
