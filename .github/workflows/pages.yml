name: Public website

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_run:
    workflows: [Promote Release, "Promote Release (standing native-testing waiver)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-website
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Select the latest public release comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -f "site/data/comparisons/${TAG}.json"
          printf 'SITE_RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
      - name: Validate comparison evidence structure
        run: go run ./scripts/comparison-check
      - name: Build the reviewed static site
        working-directory: site
        run: npm ci && npm audit --audit-level=high && npm test && npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
