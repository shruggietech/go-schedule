name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci-success:
    name: Require successful CI for tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for exact-commit main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10")
            RUN=$(printf '%s' "$RESPONSE" | jq -c '[.workflow_runs[] | select(.head_branch == "main" and .event == "push")] | sort_by(.created_at) | reverse | .[0] // empty')
            if [ -n "$RUN" ]; then
              STATUS=$(printf '%s' "$RUN" | jq -r '.status')
              CONCLUSION=$(printf '%s' "$RUN" | jq -r '.conclusion // ""')
              URL=$(printf '%s' "$RUN" | jq -r '.html_url')
              if [ "$STATUS" = completed ] && [ "$CONCLUSION" = success ]; then
                echo "Exact-commit main CI succeeded: ${URL}"
                exit 0
              fi
              if [ "$STATUS" = completed ]; then
                echo "::error::Exact-commit main CI concluded ${CONCLUSION}: ${URL}"
                exit 1
              fi
              echo "Exact-commit main CI is ${STATUS}: ${URL}"
            else
              echo "Exact-commit main CI has not started yet."
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "::error::Timed out waiting for successful main CI on ${GITHUB_SHA}."
              exit 1
            fi
            sleep 15
          done

  # The badge follows the latest published GitHub release, while release
  # preparation updates the static health example, changelog boundary, and
  # tag-specific notes through review. Verify every source-owned identity in
  # the tagged checkout before any draft-release staging job can run.
  readme-version:
    name: Verify release source metadata for this tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify the README release metadata
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          PLAIN="${VERSION#v}"
          BADGE='<a href="https://github.com/shruggietech/go-schedule/releases/latest"><img alt="Release" src="https://img.shields.io/github/v/release/shruggietech/go-schedule?color=58A6FF"></a>'
          HEALTH="daemon ok (version ${PLAIN})"
          RELEASE_BADGE_COUNT=$(grep -Fc -- '<img alt="Release"' README.md || true)
          if [ "$RELEASE_BADGE_COUNT" -ne 1 ]; then
            echo "::error file=README.md::Expected exactly one release badge line; found ${RELEASE_BADGE_COUNT}."
            exit 1
          fi
          HEALTH_LINE_COUNT=$(grep -Fc -- 'daemon ok (version ' README.md || true)
          if [ "$HEALTH_LINE_COUNT" -ne 1 ]; then
            echo "::error file=README.md::Expected exactly one health version line; found ${HEALTH_LINE_COUNT}."
            exit 1
          fi
          BADGE_LINE_COUNT=$(sed 's/^[[:space:]]*//; s/[[:space:]]*$//' README.md | grep -Fxc -- "$BADGE" || true)
          if [ "$BADGE_LINE_COUNT" -ne 1 ]; then
            echo "::error file=README.md::Release badge must follow the latest published GitHub release."
            exit 1
          fi
          grep -Fqx -- "$HEALTH" README.md || {
            echo "::error file=README.md::Health example does not match ${VERSION}. Update it in the release-preparation pull request."
            exit 1
          }
          CHANGELOG_HEADING="## [${PLAIN}] - "
          CHANGELOG_HEADING_COUNT=$(grep -Fc -- "$CHANGELOG_HEADING" CHANGELOG.md || true)
          if [ "$CHANGELOG_HEADING_COUNT" -ne 1 ]; then
            echo "::error file=CHANGELOG.md::Expected exactly one dated ${VERSION} section; found ${CHANGELOG_HEADING_COUNT}."
            exit 1
          fi
          CHANGELOG_HEADING_LINE=$(grep -F -- "$CHANGELOG_HEADING" CHANGELOG.md)
          CHANGELOG_ANCHOR=$(printf '%s\n' "$CHANGELOG_HEADING_LINE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9 -]//g; s/[ ]/-/g; s/^-+|-+$//g')
          RELEASE_NOTES=".github/release-notes/${VERSION}.md"
          if ! test -f "$RELEASE_NOTES"; then
            echo "::error file=${RELEASE_NOTES}::Tag-specific release notes are missing."
            exit 1
          fi
          CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/CHANGELOG.md#${CHANGELOG_ANCHOR}"
          CHANGELOG_LINK_COUNT=$(grep -Fc -- "$CHANGELOG_URL" "$RELEASE_NOTES" || true)
          if [ "$CHANGELOG_LINK_COUNT" -ne 1 ]; then
            echo "::error file=${RELEASE_NOTES}::Expected exactly one changelog link for ${VERSION}; found ${CHANGELOG_LINK_COUNT}."
            exit 1
          fi

  release-state:
    name: Require absent or draft release state
    needs: [readme-version, ci-success]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse to mutate an already-public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --write-out $'\n%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          STATUS=${RESPONSE##*$'\n'}
          BODY=${RESPONSE%$'\n'*}
          case "$STATUS" in
            200)
              if [ "$(printf '%s' "$BODY" | jq -r '.draft')" != true ]; then
                echo "::error::Release ${GITHUB_REF_NAME} is already public."
                exit 1
              fi
              ;;
            404) ;;
            *)
              echo "::error::Could not verify release state (HTTP ${STATUS})."
              exit 1
              ;;
          esac

  binaries:
    name: Build & stage release binaries (daemon + CLI)
    needs: release-state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, package, and checksum all platforms
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/shruggietech/go-schedule/internal/buildinfo.Version=${VERSION}"
          mkdir -p dist

          # The daemon (goschedd) and CLI (gosched) are cgo-free and cross-compile
          # cleanly for Linux/macOS (servers / headless). Windows is distributed
          # exclusively as a formal .msi (built in the gui job), so it is NOT
          # cross-compiled into a portable archive here.
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for target in $targets; do
            os=${target%/*}; arch=${target#*/}

            stage="go-schedule_${VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch go build -ldflags "$LDFLAGS" -o "$stage/goschedd" ./cmd/goschedd
            GOOS=$os GOARCH=$arch go build -ldflags "$LDFLAGS" -o "$stage/gosched" ./cmd/gosched
            cp README.md LICENSE CHANGELOG.md "$stage/"
            tar -czf "dist/${stage}.tar.gz" "$stage"
            rm -rf "$stage"
          done

          # The final integrity inventory is added only during promotion, after
          # every platform artifact and the attended evidence archive exist.
          echo "--- artifacts ---"; ls -la dist
          sha256sum dist/* # for the build log only

      - name: Stage binaries in the draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/*.tar.gz
            dist/*.msi

  gui:
    name: Build & stage GUI (${{ matrix.os }})
    needs: binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            ldflags: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            ldflags: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            ldflags: "-H windowsgui"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Wails build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install exact frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      # WiX v6 builds the Windows .msi from build/windows/goschedule.wxs.
      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Pin WiX and its extensions to the SAME version, a floating extension
          # version (e.g. 7.x) is incompatible with a 6.x toolset (WIX6101).
          dotnet tool install --global wix --version 6.0.2
          wix --version
          # Extensions used by goschedule.wxs: WixUI (install wizard) + Util
          # (CloseApplication for stale-daemon termination).
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2

      - name: Build the self-contained desktop bundle (GUI + daemon + CLI)
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BASE="-s -w -X github.com/shruggietech/go-schedule/internal/buildinfo.Version=${VERSION}"
          stage="go-schedule-desktop_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "$stage"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            (cd desktop && go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -tags webkit2_41 -ldflags "$BASE")
            cp desktop/build/bin/gosched-gui "$stage/gosched-gui"
          else
            (cd desktop && go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -ldflags "$BASE ${{ matrix.ldflags }}")
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp desktop/build/bin/gosched-gui.exe "$stage/gosched-gui.exe"
          fi
          # Bundle the daemon and CLI so the desktop distribution is self-contained.
          go build -ldflags "$BASE" -o "$stage/goschedd${{ matrix.ext }}" ./cmd/goschedd
          go build -ldflags "$BASE" -o "$stage/gosched${{ matrix.ext }}" ./cmd/gosched
          cp README.md LICENSE CHANGELOG.md "$stage/"
          cp brand/fonts/licenses/OFL-Geist.txt brand/fonts/licenses/OFL-Space-Grotesk.txt "$stage/"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            # Wails creates the native .app. The daemon and CLI live beside its
            # executable so the desktop's "daemon next to me" lookup resolves.
            # Its generated bundle uses the display name; staging renames that
            # directory to preserve the established gosched-gui.app contract.
            app="$stage/gosched-gui.app"
            cp -R desktop/build/bin/go-schedule.app "$app"
            mv "$stage/goschedd" "$stage/gosched" "$app/Contents/MacOS/"
            cp brand/platform/macos/go-schedule.icns "$app/Contents/Resources/icon.icns"
            mkdir -p "$app/Contents/Resources/licenses"
            cp brand/fonts/licenses/OFL-Geist.txt brand/fonts/licenses/OFL-Space-Grotesk.txt "$app/Contents/Resources/licenses/"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier tech.shruggie.goschedule" "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION#v}" "$app/Contents/Info.plist"
          fi
          if [ "${{ matrix.goos }}" = "linux" ]; then
            # Ship freedesktop integration beside the portable desktop bundle.
            # Users or downstream packages can install this share/ tree without
            # having to recreate names, categories, or small-size artwork.
            mkdir -p "$stage/share/applications" "$stage/share/icons"
            cp brand/platform/linux/go-schedule.desktop "$stage/share/applications/"
            cp -R brand/platform/linux/hicolor "$stage/share/icons/"
          fi
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Windows ships ONLY as a formal .msi (no portable zip). The three exes
            # were built into "$stage"; add the installer-private cleanup helper
            # as a windowless Binary-table payload, then hand the folder to WiX.
            go build -ldflags "$BASE -H windowsgui" \
              -o "$stage/gosched-cleanup.exe" ./cmd/gosched-cleanup
            pwsh build/windows/verify_wxs.ps1 -StageDir "$stage"
            VER_NUMERIC="${VERSION#v}"
            wix build build/windows/goschedule.wxs -arch x64 \
              -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
              -d Version="${VER_NUMERIC}" \
              -d StageDir="$(pwd -W 2>/dev/null || pwd)/${stage}" \
              -o "dist/go-schedule_${VERSION}_windows_amd64.msi"
            pwsh test/windows/inspect-installer.ps1 \
              -MsiPath "dist/go-schedule_${VERSION}_windows_amd64.msi" \
              -ArtifactClass candidate \
              -ArtifactOrigin "draft release staging run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} from commit ${GITHUB_SHA}" \
              -CandidateManifestPath "dist/windows-candidate-manifest.json" \
              -Repository "${GITHUB_REPOSITORY}" \
              -Tag "${GITHUB_REF_NAME}" \
              -Commit "${GITHUB_SHA}" \
              -Workflow "Release" \
              -RunId "${GITHUB_RUN_ID}" \
              -RunAttempt "${GITHUB_RUN_ATTEMPT}"
          else
            tar -czf "dist/${stage}.tar.gz" "$stage"
          fi
          ls -la dist

      # Explicit patterns, not dist/*: `wix build` drops a .wixpdb (debug symbols)
      # next to the .msi, and a bare glob published it as a release asset.
      - name: Stage GUI artifact in the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.msi
            dist/windows-candidate-manifest.json
