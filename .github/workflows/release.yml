name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # Release preparation updates these static version lines through review.
  # Verify them in the tagged checkout without trying to push directly to
  # main. This preflight gates every release publication job.
  readme-version:
    name: Verify the static README version lines match this tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify the README version lines
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          MSG="${VERSION//-/--}"
          PLAIN="${VERSION#v}"
          BADGE="<a href=\"https://github.com/shruggietech/go-schedule/releases/latest\"><img alt=\"Release\" src=\"https://img.shields.io/badge/release-${MSG}-58A6FF\"></a>"
          HEALTH="daemon ok (version ${PLAIN})"
          RELEASE_BADGE_COUNT=$(grep -Fc -- '<img alt="Release"' README.md || true)
          if [ "$RELEASE_BADGE_COUNT" -ne 1 ]; then
            echo "::error file=README.md::Expected exactly one release badge line; found ${RELEASE_BADGE_COUNT}."
            exit 1
          fi
          HEALTH_LINE_COUNT=$(grep -Fc -- 'daemon ok (version ' README.md || true)
          if [ "$HEALTH_LINE_COUNT" -ne 1 ]; then
            echo "::error file=README.md::Expected exactly one health version line; found ${HEALTH_LINE_COUNT}."
            exit 1
          fi
          BADGE_LINE_COUNT=$(sed 's/^[[:space:]]*//; s/[[:space:]]*$//' README.md | grep -Fxc -- "$BADGE" || true)
          if [ "$BADGE_LINE_COUNT" -ne 1 ]; then
            echo "::error file=README.md::Release badge does not match ${VERSION}. Update it in the release-preparation pull request."
            exit 1
          fi
          grep -Fqx -- "$HEALTH" README.md || {
            echo "::error file=README.md::Health example does not match ${VERSION}. Update it in the release-preparation pull request."
            exit 1
          }

  binaries:
    name: Build & publish release binaries (daemon + CLI)
    needs: readme-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, package, and checksum all platforms
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/shruggietech/go-schedule/internal/buildinfo.Version=${VERSION}"
          mkdir -p dist

          # The daemon (goschedd) and CLI (gosched) are cgo-free and cross-compile
          # cleanly for Linux/macOS (servers / headless). Windows is distributed
          # exclusively as a formal .msi (built in the gui job), so it is NOT
          # cross-compiled into a portable archive here.
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for target in $targets; do
            os=${target%/*}; arch=${target#*/}

            stage="go-schedule_${VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch go build -ldflags "$LDFLAGS" -o "$stage/goschedd" ./cmd/goschedd
            GOOS=$os GOARCH=$arch go build -ldflags "$LDFLAGS" -o "$stage/gosched" ./cmd/gosched
            cp README.md LICENSE CHANGELOG.md "$stage/"
            tar -czf "dist/${stage}.tar.gz" "$stage"
            rm -rf "$stage"
          done

          # Checksums are NOT written here. This job only sees its own tarballs,
          # so a SHA256SUMS.txt built now would omit the .msi and the desktop
          # bundles that the gui job produces. The checksums job publishes one
          # complete file once every asset exists.
          echo "--- artifacts ---"; ls -la dist
          sha256sum dist/* # for the build log only

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/*.tar.gz
            dist/*.msi

  gui:
    name: Build & publish GUI (${{ matrix.os }})
    needs: binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            ldflags: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            ldflags: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            ldflags: "-H windowsgui"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Fyne build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            xorg-dev

      # Embed the .exe file icon (shown in Explorer/taskbar) via a generated COFF
      # resource. The .syso is built here, not committed: a Windows-format .syso
      # would break the CGO-free `go build ./...` path on other platforms, and it
      # only links cleanly under the external (cgo) linker the GUI build uses.
      - name: Generate Windows executable icon resource
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # -64 is required: without it goversioninfo emits a 32-bit (i386)
          # resource that the amd64 linker rejects ("incompatible architecture").
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 \
            -64 \
            -icon=brand/platform/windows/go-schedule.ico \
            -o=cmd/gosched-gui/resource_windows_amd64.syso \
            cmd/gosched-gui/versioninfo.json

      # WiX v6 builds the Windows .msi from build/windows/goschedule.wxs.
      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Pin WiX and its extensions to the SAME version — a floating extension
          # version (e.g. 7.x) is incompatible with a 6.x toolset (WIX6101).
          dotnet tool install --global wix --version 6.0.2
          wix --version
          # Extensions used by goschedule.wxs: WixUI (install wizard) + Util
          # (CloseApplication for stale-daemon termination).
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2

      - name: Build the self-contained desktop bundle (GUI + daemon + CLI)
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BASE="-s -w -X github.com/shruggietech/go-schedule/internal/buildinfo.Version=${VERSION}"
          stage="go-schedule-desktop_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "$stage"
          # GUI: windowless on Windows. It auto-starts the daemon if none is running.
          go build -ldflags "$BASE ${{ matrix.ldflags }}" -o "$stage/gosched-gui${{ matrix.ext }}" ./cmd/gosched-gui
          # Bundle the daemon and CLI so the GUI is self-contained.
          go build -ldflags "$BASE" -o "$stage/goschedd${{ matrix.ext }}" ./cmd/goschedd
          go build -ldflags "$BASE" -o "$stage/gosched${{ matrix.ext }}" ./cmd/gosched
          cp README.md LICENSE CHANGELOG.md "$stage/"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            # Wrap the GUI in a .app so Finder/Dock show the icon. The daemon and
            # CLI live beside the GUI binary inside the bundle, so the GUI's
            # "daemon next to me" autostart lookup still resolves.
            app="$stage/gosched-gui.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            mv "$stage/gosched-gui" "$stage/goschedd" "$stage/gosched" "$app/Contents/MacOS/"
            # The reviewed platform artifact is generated with the rest of the
            # canonical kit and verified before commit. Release packaging copies
            # it directly instead of maintaining a second resampling pipeline.
            cp brand/platform/macos/go-schedule.icns "$app/Contents/Resources/icon.icns"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>go-schedule</string>
            <key>CFBundleDisplayName</key><string>go-schedule</string>
            <key>CFBundleExecutable</key><string>gosched-gui</string>
            <key>CFBundleIdentifier</key><string>tech.shruggie.goschedule</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          fi
          if [ "${{ matrix.goos }}" = "linux" ]; then
            # Ship freedesktop integration beside the portable desktop bundle.
            # Users or downstream packages can install this share/ tree without
            # having to recreate names, categories, or small-size artwork.
            mkdir -p "$stage/share/applications" "$stage/share/icons"
            cp brand/platform/linux/go-schedule.desktop "$stage/share/applications/"
            cp -R brand/platform/linux/hicolor "$stage/share/icons/"
          fi
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Windows ships ONLY as a formal .msi (no portable zip). The three exes
            # were built into "$stage"; hand that folder to WiX as the stage dir.
            pwsh build/windows/verify_wxs.ps1 -StageDir "$stage"
            VER_NUMERIC="${VERSION#v}"
            wix build build/windows/goschedule.wxs -arch x64 \
              -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
              -d Version="${VER_NUMERIC}" \
              -d StageDir="$(pwd -W 2>/dev/null || pwd)/${stage}" \
              -o "dist/go-schedule_${VERSION}_windows_amd64.msi"
          else
            tar -czf "dist/${stage}.tar.gz" "$stage"
          fi
          ls -la dist

      # Explicit patterns, not dist/*: `wix build` drops a .wixpdb (debug symbols)
      # next to the .msi, and a bare glob published it as a release asset.
      - name: Attach GUI artifact to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.msi

  # Runs last, once every asset is attached, so the published checksum file
  # covers the whole release — including the .msi and the desktop bundles, which
  # are built in the gui job and so were previously unchecksummed.
  checksums:
    name: Publish SHA256SUMS for every asset
    needs: [binaries, gui]
    runs-on: ubuntu-latest
    steps:
      - name: Checksum every published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*'
          # Idempotent on re-run: a checksum file from a previous attempt would
          # otherwise be downloaded and listed inside its own replacement.
          rm -f SHA256SUMS.txt
          # Write outside the directory first: the glob must not pick up the file
          # being created, and a partial upload must never overwrite a good one.
          sha256sum * > "${RUNNER_TEMP}/SHA256SUMS.txt"
          cat "${RUNNER_TEMP}/SHA256SUMS.txt"
          gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" --clobber
