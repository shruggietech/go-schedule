# S029: low-noise dependency proposals for the two maintained ecosystems.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep high-impact subsystems isolated so a GUI regression cannot block or
      # obscure an otherwise healthy storage or platform update. The catch-all
      # group preserves the low-noise policy for remaining routine updates.
      gui-minor-and-patch:
        patterns:
          - fyne.io/*
        update-types:
          - minor
          - patch
      storage-minor-and-patch:
        patterns:
          - modernc.org/sqlite
        update-types:
          - minor
          - patch
      platform-minor-and-patch:
        patterns:
          - github.com/kardianos/service
          - golang.org/x/sys
        update-types:
          - minor
          - patch
      routine-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      routine-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
