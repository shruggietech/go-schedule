# Low-noise dependency proposals for the root services, production desktop, frontend, and hosted automation.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep high-impact storage and platform updates isolated. The catch-all
      # group preserves the low-noise policy for remaining routine updates.
      storage-minor-and-patch:
        patterns:
          - modernc.org/sqlite
        update-types:
          - minor
          - patch
      platform-minor-and-patch:
        patterns:
          - github.com/kardianos/service
          - golang.org/x/sys
        update-types:
          - minor
          - patch
      routine-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-minor-and-patch:
        patterns:
          - github.com/wailsapp/wails/v2
        update-types:
          - minor
          - patch
      routine-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      routine-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
