openapi: 3.1.0
info:
  title: go-schedule Remote API
  version: 1.0.0
  description: Opt-in authenticated HTTPS access to a bounded subset of daemon operations.
servers:
  - url: https://{daemon}/api/v1
    variables:
      daemon: {default: 127.0.0.1:8443}
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health.read
      security: []
      responses: {"200": {$ref: "#/components/responses/Health"}}
  /manifest:
    get:
      operationId: manifest.read
      security: []
      responses: {"200": {$ref: "#/components/responses/Manifest"}}
  /enroll:
    post:
      operationId: enrollment.exchange
      security: []
      requestBody: {$ref: "#/components/requestBodies/Enrollment"}
      responses: {"201": {$ref: "#/components/responses/IssuedCredential"}, "401": {$ref: "#/components/responses/Unauthorized"}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /tasks:
    get:
      operationId: tasks.list
      parameters:
        - {name: group, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string}}
        - {name: scheduled, in: query, schema: {type: boolean}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 0, maximum: 101}}
        - {name: text_limit, in: query, schema: {type: integer, minimum: 0, maximum: 2048}}
      responses: {"200": {$ref: "#/components/responses/TaskList"}, "401": {$ref: "#/components/responses/Unauthorized"}}
    post:
      operationId: tasks.create
      requestBody: {$ref: "#/components/requestBodies/TaskCreate"}
      responses: {"201": {$ref: "#/components/responses/TaskObservation"}, "401": {$ref: "#/components/responses/Unauthorized"}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /tasks/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: tasks.read
      responses: {"200": {$ref: "#/components/responses/TaskObservation"}, "401": {$ref: "#/components/responses/Unauthorized"}}
    patch:
      operationId: tasks.update
      requestBody: {$ref: "#/components/requestBodies/TaskUpdate"}
      responses: {"200": {$ref: "#/components/responses/TaskObservation"}, "401": {$ref: "#/components/responses/Unauthorized"}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
    delete:
      operationId: tasks.delete
      responses: {"204": {$ref: "#/components/responses/NoContent"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /tasks/{id}/enable:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: tasks.enable
      responses: {"204": {$ref: "#/components/responses/NoContent"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /tasks/{id}/disable:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: tasks.disable
      responses: {"204": {$ref: "#/components/responses/NoContent"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /tasks/{id}/run-now:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: tasks.run_now
      responses: {"202": {$ref: "#/components/responses/Accepted"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /groups:
    get:
      operationId: groups.list
      parameters:
        - {name: tree, in: query, schema: {type: boolean}}
      responses: {"200": {$ref: "#/components/responses/GroupList"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /groups/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: groups.read
      responses: {"200": {$ref: "#/components/responses/Group"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /runs:
    get:
      operationId: runs.list
      parameters:
        - {name: task, in: query, schema: {type: string, format: uuid}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 0}}
        - {name: output_limit, in: query, schema: {type: integer, minimum: 0}}
      responses: {"200": {$ref: "#/components/responses/RunList"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /runs/active:
    get:
      operationId: runs.active.list
      responses: {"200": {$ref: "#/components/responses/RunList"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /runs/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: runs.read
      responses: {"200": {$ref: "#/components/responses/Run"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /runs/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: runs.cancel
      description: Requests cancellation of one exact active execution. Acceptance is not proof of termination; observe active runs and final history.
      responses:
        "202": {$ref: "#/components/responses/RunCancellation"}
        "200": {$ref: "#/components/responses/RunCancellation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Existing credential lacks operating authority}
        "404": {description: Run ID is unknown}
        "409": {description: Known history marker is not an active execution}
  /alerts:
    get:
      operationId: alerts.list
      parameters:
        - {name: unacked, in: query, schema: {type: boolean}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 0}}
        - {name: message_limit, in: query, schema: {type: integer, minimum: 0}}
      responses: {"200": {$ref: "#/components/responses/AlertList"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /alerts/{id}/ack:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: alerts.acknowledge
      responses: {"204": {$ref: "#/components/responses/NoContent"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /calendar:
    get:
      operationId: calendar.read
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses: {"200": {$ref: "#/components/responses/Calendar"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /system-summary:
    get:
      operationId: system.summary.read
      description: Returns one bounded, read-only operational observation without executable configuration, output, messages, destinations, payloads, or credentials.
      responses: {"200": {$ref: "#/components/responses/SystemSummary"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /search:
    get:
      operationId: search.read
      description: Returns a bounded, secret-free search projection for tasks, groups, recent failures, upcoming schedules, and unacknowledged alerts.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - name: kind
          in: query
          style: form
          explode: true
          schema: {type: array, items: {$ref: "#/components/schemas/SearchKind"}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses: {"200": {$ref: "#/components/responses/Search"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /bundles/export:
    get:
      operationId: bundles.export
      description: Returns a versioned secret-free portable automation document. Version 2 adds source and notification policy intent; unreleased source exports version 3 with parallel join definitions and no execution state.
      responses: {"200": {description: Portable automation bundle}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /bundles/validate:
    post:
      operationId: bundles.validate
      description: Validates an untrusted portable bundle without target mutation.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Bundle validation result}, "401": {$ref: "#/components/responses/Unauthorized"}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /bundles/preview:
    post:
      operationId: bundles.preview
      description: Creates a short-lived target-bound plan without target mutation. Optional watcher_paths bind new watchers to absolute target-local paths outside the bundle document.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Target-bound bundle plan}, "401": {$ref: "#/components/responses/Unauthorized"}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /bundles/compare:
    post:
      operationId: bundles.compare
      description: Reports bundle drift against one selected target without mutation.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Read-only bundle drift plan}, "401": {$ref: "#/components/responses/Unauthorized"}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /bundles/apply:
    post:
      operationId: bundles.apply
      description: Applies only a short-lived reviewed target-bound plan.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Per-item bundle apply outcomes}, "401": {$ref: "#/components/responses/Unauthorized"}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /events:
    get:
      operationId: events.stream
      description: Reconnect-safe read stream. Mutations are never automatically replayed.
      responses:
        "200": {description: Server-sent event stream, content: {text/event-stream: {schema: {type: string}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /access/actors:
    get:
      operationId: actors.list
      responses: {"200": {$ref: "#/components/responses/ActorList"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /access/current:
    get:
      operationId: actors.current
      description: Returns the authenticated actor and its current server-owned capability.
      responses: {"200": {$ref: "#/components/responses/Actor"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /audit:
    get:
      operationId: audit.list
      parameters:
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - {name: operation, in: query, schema: {type: string}}
        - {name: result, in: query, schema: {type: string, enum: [uncertain, succeeded, failed, denied]}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 0, maximum: 1000}}
      responses: {"200": {$ref: "#/components/responses/AuditList"}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /notification-channels:
    get:
      operationId: notifications.channels.list
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannelList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: notifications.channels.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationChannelCreate"}
      responses:
        "201":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /notification-channels/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: notifications.channels.read
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      operationId: notifications.channels.update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationChannelUpdate"}
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      operationId: notifications.channels.delete
      responses:
        "204":
          description: Removed
        "401": {$ref: "#/components/responses/Unauthorized"}
  /notification-channels/{id}/enable:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: notifications.channels.enable
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /notification-channels/{id}/disable:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: notifications.channels.disable
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /notification-channels/{id}/rotate:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: notifications.channels.rotate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationChannelRotate"}
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationChannel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /notification-channels/{id}/test:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: notifications.channels.test
      responses:
        "202":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationDelivery"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /notification-deliveries:
    get:
      operationId: notifications.deliveries.list
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationDeliveryList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /tasks/{id}/notifications:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: tasks.notifications.read
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationAssignments"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      operationId: tasks.notifications.update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationAssignments"}
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationAssignments"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /tasks/{id}/notifications/effective:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: tasks.notifications.effective.read
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EffectiveNotificationPolicy"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /groups/{id}/notifications:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: groups.notifications.read
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationAssignments"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      operationId: groups.notifications.update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationAssignments"}
      responses:
        "200":
          description: Redacted notification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationAssignments"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /chains:
    get:
      operationId: chains.list
      responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/CompletionChainList"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
    post:
      operationId: chains.create
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChainCreateRequest"}}}}
      responses: {"201": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/CompletionChain"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /chains/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: chains.read
      responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/CompletionChain"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
    patch:
      operationId: chains.update
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChainUpdateRequest"}}}}
      responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/CompletionChain"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
    delete:
      operationId: chains.delete
      responses: {"204": {$ref: "#/components/responses/NoContent"}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /joins:
    get:
      operationId: joins.list
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}
        - {name: text_limit, in: query, schema: {type: integer, minimum: 1, maximum: 16384}}
        - {name: branch_offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: branch_limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}
      responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/ParallelJoinList"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
    post:
      operationId: joins.create
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/JoinCreateRequest"}}}}
      responses: {"201": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/ParallelJoin"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /joins/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: joins.read
      parameters:
        - {name: text_limit, in: query, schema: {type: integer, minimum: 1, maximum: 16384}}
        - {name: branch_offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: branch_limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}
      responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/ParallelJoin"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
    patch:
      operationId: joins.update
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/JoinUpdateRequest"}}}}
      responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/ParallelJoin"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
    delete:
      operationId: joins.delete
      responses: {"204": {$ref: "#/components/responses/NoContent"}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /join-instances:
    get:
      operationId: joins.instances.list
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}
        - {name: text_limit, in: query, schema: {type: integer, minimum: 1, maximum: 16384}}
        - {name: branch_offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: branch_limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}
        - {name: join_id, in: query, schema: {type: string}}
        - {name: entry_run_id, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {$ref: "#/components/schemas/JoinInstanceState"}}
      responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/ParallelJoinInstanceList"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
  /join-instances/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: joins.instances.read
      parameters:
        - {name: text_limit, in: query, schema: {type: integer, minimum: 1, maximum: 16384}}
        - {name: branch_offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: branch_limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}
      responses: {"200": {description: Success, content: {application/json: {schema: {$ref: "#/components/schemas/ParallelJoinInstance"}}}}, "400": {description: Invalid definition or paging query}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {description: Insufficient current actor authority}, "404": {description: Definition or referenced identity was not found}, "409": {description: Stale expected definition revision}, "413": {$ref: "#/components/responses/RequestTooLarge"}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, description: A 256-bit opaque base64url credential issued once during enrollment or rotation.}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    Enrollment: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EnrollmentRequest"}}}}
    TaskCreate: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TaskCreateRequest"}}}}
    TaskUpdate: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TaskUpdateRequest"}}}}
  responses:
    Health: {description: Daemon health, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
    Manifest: {description: Daemon identity and compatibility manifest, content: {application/json: {schema: {$ref: "#/components/schemas/Manifest"}}}}
    IssuedCredential: {description: One-time enrollment credential, content: {application/json: {schema: {$ref: "#/components/schemas/IssuedCredential"}}}}
    TaskList: {description: Task collection, content: {application/json: {schema: {$ref: "#/components/schemas/TaskList"}}}}
    TaskDetail: {description: Task detail, content: {application/json: {schema: {$ref: "#/components/schemas/TaskDetail"}}}}
    TaskObservation: {description: Secret-free task observation, content: {application/json: {schema: {$ref: "#/components/schemas/TaskObservation"}}}}
    GroupList: {description: Group collection or tree, content: {application/json: {schema: {$ref: "#/components/schemas/GroupList"}}}}
    Group: {description: Group detail, content: {application/json: {schema: {$ref: "#/components/schemas/Group"}}}}
    RunList: {description: Run collection, content: {application/json: {schema: {$ref: "#/components/schemas/RunList"}}}}
    Run: {description: Run detail, content: {application/json: {schema: {$ref: "#/components/schemas/Run"}}}}
    RunCancellation: {description: Exact-run cancellation acknowledgement, content: {application/json: {schema: {$ref: "#/components/schemas/RunCancellation"}}}}
    AlertList: {description: Alert collection, content: {application/json: {schema: {$ref: "#/components/schemas/AlertList"}}}}
    Calendar: {description: Calendar window, content: {application/json: {schema: {$ref: "#/components/schemas/Calendar"}}}}
    SystemSummary: {description: Bounded operational observation, content: {application/json: {schema: {$ref: "#/components/schemas/SystemSummary"}}}}
    Search: {description: Bounded secret-free search observation, content: {application/json: {schema: {$ref: "#/components/schemas/DaemonSearch"}}}}
    ActorList: {description: Authorized actors, content: {application/json: {schema: {$ref: "#/components/schemas/ActorList"}}}}
    Actor: {description: Current authenticated actor, content: {application/json: {schema: {$ref: "#/components/schemas/Actor"}}}}
    AuditList: {description: Management audit events, content: {application/json: {schema: {$ref: "#/components/schemas/AuditList"}}}}
    Accepted: {description: Operation accepted for asynchronous execution}
    NoContent: {description: Operation completed without a response body}
    Unauthorized: {description: Generic authentication failure, headers: {WWW-Authenticate: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
    RequestTooLarge: {description: Request body exceeds the operation limit, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  schemas:
    SMTPConfig:
      type: object
      additionalProperties: false
      required: [host, tls_mode, from, recipients]
      properties:
        host: {type: string, maxLength: 253}
        port: {type: integer, minimum: 0, maximum: 65535}
        tls_mode: {type: string, enum: [starttls, tls, plain]}
        from: {type: string, maxLength: 320}
        recipients: {type: array, minItems: 1, maxItems: 100, items: {type: string, maxLength: 320}}
        timeout_seconds: {type: integer, minimum: 0, maximum: 60}
        html: {type: boolean}
    SMTPAuth:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, maxLength: 1024, writeOnly: true}
        password: {type: string, maxLength: 4096, writeOnly: true}
    NotificationChannelCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 256}
        kind: {type: string, enum: [webhook, smtp], default: webhook}
        endpoint: {type: string, writeOnly: true}
        authorization: {type: string, writeOnly: true}
        smtp: {$ref: "#/components/schemas/SMTPConfig"}
        smtp_auth: {$ref: "#/components/schemas/SMTPAuth"}
        enabled: {type: boolean}
        health_interval_seconds: {type: integer}
    NotificationChannelUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 256}
        kind: {type: string, enum: [webhook, smtp], description: Must match the existing immutable kind.}
        endpoint: {type: string, writeOnly: true}
        smtp: {$ref: "#/components/schemas/SMTPConfig"}
        enabled: {type: boolean}
        health_interval_seconds: {type: integer}
    NotificationChannelRotate:
      type: object
      properties:
        authorization: {type: string, writeOnly: true}
        smtp_auth: {$ref: "#/components/schemas/SMTPAuth"}
    NotificationChannel:
      type: object
      required: [id, name, kind, endpoint_summary, has_authorization, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [webhook, smtp]}
        endpoint_summary: {type: string}
        has_authorization: {type: boolean}
        smtp: {$ref: "#/components/schemas/SMTPConfig"}
        enabled: {type: boolean}
        health_interval_seconds: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationChannelList:
      type: object
      required: [notification_channels]
      properties:
        notification_channels: {type: array, items: {$ref: "#/components/schemas/NotificationChannel"}}
    NotificationAssignment:
      type: object
      properties:
        id: {type: string}
        channel_id: {type: string}
        scope_type: {type: string}
        scope_id: {type: string}
        on_success: {type: boolean}
        on_failure: {type: boolean}
        failure_threshold: {type: integer}
        on_failure_to_start: {type: boolean}
        duration_threshold_seconds: {type: integer}
        on_recovery: {type: boolean}
        reminder_interval_seconds: {type: integer}
        quiet_period_seconds: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationAssignments:
      type: object
      required: [assignments]
      properties:
        assignments: {type: array, items: {$ref: "#/components/schemas/NotificationAssignment"}}
    EffectiveNotificationPolicy:
      type: object
      required: [task_id, source_scope_type, assignments]
      properties:
        task_id: {type: string}
        source_scope_type: {type: string}
        source_scope_id: {type: string}
        assignments: {type: array, items: {$ref: "#/components/schemas/NotificationAssignment"}}
    NotificationRecipient:
      type: object
      required: [address, state]
      properties:
        address: {type: string}
        state: {type: string, enum: [pending, submitting, accepted, temporary_failure, permanent_failure, uncertain]}
        code: {type: integer}
        diagnostic: {type: string}
    NotificationDelivery:
      type: object
      required: [id, channel_name, destination_summary, event_kind, state, attempts, created_at]
      properties:
        id: {type: string}
        channel_id: {type: string}
        channel_name: {type: string}
        destination_summary: {type: string}
        kind: {type: string, enum: [webhook, smtp]}
        smtp: {$ref: "#/components/schemas/SMTPConfig"}
        recipients: {type: array, items: {$ref: "#/components/schemas/NotificationRecipient"}}
        event_kind: {type: string}
        task_id: {type: string}
        run_id: {type: string}
        task_name: {type: string}
        group_id: {type: string}
        group_name: {type: string}
        event: {type: object, additionalProperties: true}
        state: {type: string}
        attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        claimed_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        last_status: {type: integer}
        diagnostic: {type: string, description: "Authored transport result detail, including successful SMTP server acceptance. This does not confirm inbox delivery."}
        last_error: {type: string, description: "Current failure detail. Empty for succeeded SMTP deliveries."}
        condition_kind: {type: string}
        condition_summary: {type: string}
    NotificationDeliveryList:
      type: object
      required: [notification_deliveries]
      properties:
        notification_deliveries: {type: array, items: {$ref: "#/components/schemas/NotificationDelivery"}}
    DaemonSearch:
      type: object
      additionalProperties: false
      required: [schema, query, observed_at, truncated, results]
      properties:
        schema: {type: string, const: go-schedule.daemon-search.v1}
        query: {type: string}
        observed_at: {type: string, format: date-time}
        truncated: {type: boolean}
        results: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/SearchMatch"}}
    SearchMatch:
      type: object
      additionalProperties: false
      required: [kind, object_id, name, action_hints]
      properties:
        kind: {$ref: "#/components/schemas/SearchKind"}
        object_id: {type: string}
        task_id: {type: string}
        name: {type: string}
        context: {type: string}
        occurred_at: {type: string, format: date-time}
        enabled: {type: boolean}
        action_hints: {type: array, items: {$ref: "#/components/schemas/SearchAction"}}
    SearchKind: {type: string, enum: [task, group, failure, schedule, alert]}
    SearchAction: {type: string, enum: [open, acknowledge, enable, disable, run_now]}
    SystemSummary:
      type: object
      additionalProperties: false
      required: [schema, observed_at, active_task_count, recent_failure_count, unacknowledged_alert_count, notification_problem_count]
      properties:
        schema: {type: string, const: go-schedule.system-summary.v1}
        observed_at: {type: string, format: date-time}
        active_task_count: {type: integer, minimum: 0}
        next_occurrence: {$ref: "#/components/schemas/UpcomingSummary"}
        recent_failure_count: {type: integer, minimum: 0}
        recent_failure: {$ref: "#/components/schemas/FailureSummary"}
        unacknowledged_alert_count: {type: integer, minimum: 0}
        unacknowledged_alert: {$ref: "#/components/schemas/AlertSummary"}
        notification_problem_count: {type: integer, minimum: 0}
        notification_problem: {$ref: "#/components/schemas/NotificationProblemSummary"}
    UpcomingSummary:
      type: object
      additionalProperties: false
      required: [task_id, task_name, scheduled_for]
      properties: {task_id: {type: string}, task_name: {type: string}, scheduled_for: {type: string, format: date-time}}
    FailureSummary:
      type: object
      additionalProperties: false
      required: [run_id, task_id, task_name, ended_at]
      properties: {run_id: {type: string}, task_id: {type: string}, task_name: {type: string}, ended_at: {type: string, format: date-time}}
    AlertSummary:
      type: object
      additionalProperties: false
      required: [alert_id, severity, kind, created_at]
      properties: {alert_id: {type: string}, task_id: {type: string}, run_id: {type: string}, severity: {type: string}, kind: {type: string}, created_at: {type: string, format: date-time}}
    NotificationProblemSummary:
      type: object
      additionalProperties: false
      required: [delivery_id, channel_name, state, created_at]
      properties: {delivery_id: {type: string}, task_id: {type: string}, run_id: {type: string}, channel_name: {type: string}, state: {type: string, enum: [pending, claimed, failed]}, created_at: {type: string, format: date-time}}
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties: {status: {type: string, const: ok}, version: {type: string}}
    Manifest:
      type: object
      additionalProperties: false
      required: [installation_id, display_name, product_version, local_api_versions, remote_api_versions, operating_mode, capabilities, platform]
      properties:
        installation_id: {type: string, format: uuid}
        display_name: {type: string}
        product_version: {type: string}
        local_api_versions: {type: array, items: {type: string}}
        remote_api_versions: {type: array, items: {type: string}}
        operating_mode: {type: string}
        capabilities: {type: array, items: {type: string}}
        platform: {$ref: "#/components/schemas/Platform"}
    Platform:
      type: object
      additionalProperties: false
      required: [os, architecture]
      properties: {os: {type: string}, architecture: {type: string}}
    EnrollmentRequest:
      type: object
      additionalProperties: false
      required: [pairing_id, phrase, daemon_id, display_name, kind, capability]
      properties:
        pairing_id: {type: string, format: uuid}
        phrase: {type: string, minLength: 1, maxLength: 256}
        daemon_id: {type: string, format: uuid}
        display_name: {type: string, minLength: 1, maxLength: 80}
        kind: {$ref: "#/components/schemas/ActorKind"}
        capability: {$ref: "#/components/schemas/Capability"}
    IssuedCredential:
      type: object
      additionalProperties: false
      required: [id, actor_id, fingerprint, state, created_at, updated_at, actor, token, daemon_id]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        fingerprint: {type: string}
        state: {type: string, enum: [active, revoked]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        actor: {$ref: "#/components/schemas/Actor"}
        token: {type: string, description: Returned once. Store in the operating system credential store.}
        daemon_id: {type: string, format: uuid}
    TaskCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        group_id: {type: string, format: uuid}
        command: {type: string}
        args: {type: array, items: {type: string}}
        working_dir: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        stdin: {type: string}
        run_as: {type: string}
        timezone: {type: string}
        schedule: {type: string}
        schedule_syntax: {type: string}
        at: {type: string, format: date-time}
        overlap_policy: {type: string, enum: [queue_one, skip, allow_concurrent]}
        catchup_policy: {type: string, enum: [one, none]}
        missing_date_policy: {type: string, enum: [skip, last_valid, next_valid]}
        time_basis: {type: string, enum: [wall_clock, elapsed, utc]}
        dst_gap_policy: {type: string, enum: [next_valid, skip]}
        dst_overlap_policy: {type: string, enum: [first, both, last]}
        enabled: {type: boolean}
    TaskUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string}
        group_id: {type: string, format: uuid}
        command: {type: string}
        args: {type: array, items: {type: string}}
        working_dir: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        stdin: {type: string}
        run_as: {type: string}
        timezone: {type: string}
        schedule: {type: string}
        schedule_syntax: {type: string}
        at: {type: string, format: date-time}
        overlap_policy: {type: string, enum: [queue_one, skip, allow_concurrent]}
        catchup_policy: {type: string, enum: [one, none]}
        missing_date_policy: {type: string, enum: [skip, last_valid, next_valid]}
        time_basis: {type: string, enum: [wall_clock, elapsed, utc]}
        dst_gap_policy: {type: string, enum: [next_valid, skip]}
        dst_overlap_policy: {type: string, enum: [first, both, last]}
        clear_name: {type: boolean}
        clear_command: {type: boolean}
        clear_working_dir: {type: boolean}
        clear_env: {type: boolean, description: Remove task overrides while retaining the inherited process environment.}
        clear_run_as: {type: boolean}
        clear_schedule: {type: boolean}
    TaskList:
      type: object
      additionalProperties: false
      required: [tasks]
      properties: {tasks: {type: array, items: {$ref: "#/components/schemas/TaskObservation"}}}
    TaskDetail:
      type: object
      additionalProperties: false
      required: [task, schedule, readiness, policy_summary, next_runs]
      properties:
        task: {$ref: "#/components/schemas/Task"}
        schedule: {oneOf: [{$ref: "#/components/schemas/Schedule"}, {type: "null"}]}
        readiness: {$ref: "#/components/schemas/Readiness"}
        policy_summary: {type: string}
        next_runs: {type: array, items: {type: string, format: date-time}}
    Task:
      type: object
      additionalProperties: false
      required: [id, name, command, enabled, timezone, schedule_id, overlap_policy, catchup_policy, missing_date_policy, time_basis, dst_gap_policy, dst_overlap_policy, state, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        group_id: {type: string, format: uuid}
        command: {type: string}
        args: {type: array, items: {type: string}}
        working_dir: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        stdin: {type: string}
        run_as: {type: string}
        enabled: {type: boolean}
        timezone: {type: string}
        schedule_id: {type: string}
        overlap_policy: {type: string}
        catchup_policy: {type: string}
        missing_date_policy: {type: string}
        time_basis: {type: string}
        dst_gap_policy: {type: string}
        dst_overlap_policy: {type: string}
        state: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TaskObservation:
      type: object
      additionalProperties: false
      required: [id, name, enabled, state, timezone, readiness, has_schedule, next_runs, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        group_id: {type: string, format: uuid}
        enabled: {type: boolean}
        state: {type: string}
        timezone: {type: string}
        readiness: {type: string}
        readiness_reason: {type: string}
        has_schedule: {type: boolean}
        schedule_summary: {type: string}
        policy_summary: {type: string}
        next_runs: {type: array, items: {type: string, format: date-time}}
        updated_at: {type: string, format: date-time}
        name_truncated: {type: boolean}
